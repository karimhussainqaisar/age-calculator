<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6b7280, #a78bfa);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }

    .calculator-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #1f2937;
    }

    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .input-field {
      flex: 1;
      min-width: 100px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: #4b5563;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #14b8a6;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    #calculate-btn {
      background: #14b8a6;
      color: white;
    }

    #clear-btn {
      background: #ef4444;
      color: white;
    }

    #result {
      margin-top: 2rem;
      padding: 1rem;
      border-radius: 8px;
      background: #f3f4f6;
      animation: slideIn 0.5s ease-out;
      display: none;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    #result p {
      margin: 0.5rem 0;
      font-size: 1rem;
    }

    @media (max-width: 600px) {
      .form-group {
        flex-direction: column;
      }

      .input-field {
        min-width: 100%;
      }

      h1 {
        font-size: 1.5rem;
      }

      button {
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="calculator-card">
    <h1>Age Calculator</h1>
    <form id="age-form">
      <div class="form-group">
        <div class="input-field">
          <label for="dob-month">Date of Birth</label>
          <select id="dob-month" required>
            <option value="">Month</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
        <div class="input-field">
          <label for="dob-day">Day</label>
          <input type="number" id="dob-day" min="1" max="31" placeholder="Day" required>
        </div>
        <div class="input-field">
          <label for="dob-year">Year</label>
          <input type="number" id="dob-year" min="1900" max="2025" placeholder="Year" required>
        </div>
      </div>
      <div class="form-group">
        <div class="input-field">
          <label for="current-month">Current Age or Age as of</label>
          <select id="current-month">
            <option value="">Month</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
        <div class="input-field">
          <label for="current-day">Day</label>
          <input type="number" id="current-day" min="1" max="31" placeholder="Day">
        </div>
        <div class="input-field">
          <label for="current-year">Year</label>
          <input type="number" id="current-year" min="1900" max="2100" placeholder="Year">
        </div>
      </div>
      <div class="button-group">
        <button type="submit" id="calculate-btn">Calculate</button>
        <button type="button" id="clear-btn">Clear</button>
      </div>
    </form>
    <div id="result"></div>
  </div>
  <script>
    document.getElementById('age-form').addEventListener('submit', function(e) {
      e.preventDefault();
      calculateAge();
    });

    document.getElementById('clear-btn').addEventListener('click', function() {
      document.getElementById('age-form').reset();
      document.getElementById('result').style.display = 'none';
    });

    function calculateAge() {
      const dobMonth = parseInt(document.getElementById('dob-month').value);
      const dobDay = parseInt(document.getElementById('dob-day').value);
      const dobYear = parseInt(document.getElementById('dob-year').value);

      let currentMonth = document.getElementById('current-month').value ? parseInt(document.getElementById('current-month').value) : new Date().getMonth() + 1;
      let currentDay = document.getElementById('current-day').value ? parseInt(document.getElementById('current-day').value) : new Date().getDate();
      let currentYear = document.getElementById('current-year').value ? parseInt(document.getElementById('current-year').value) : new Date().getFullYear();

      // Validate inputs
      if (!dobMonth || !dobDay || !dobYear || isNaN(dobMonth) || isNaN(dobDay) || isNaN(dobYear)) {
        alert('Please enter a valid Date of Birth.');
        return;
      }

      const dob = new Date(dobYear, dobMonth - 1, dobDay);
      const currentDate = new Date(currentYear, currentMonth - 1, currentDay);

      if (dob > currentDate) {
        alert('Date of Birth cannot be in the future.');
        return;
      }

      // Calculate age
      let years = currentYear - dobYear;
      let months = currentMonth - dobMonth;
      let days = currentDay - dobDay;

      if (days < 0) {
        months--;
        days += new Date(currentYear, currentMonth - 1, 0).getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      // Calculate total days
      const totalDays = Math.floor((currentDate - dob) / (1000 * 60 * 60 * 24));
      const totalWeeks = Math.floor(totalDays / 7);
      const totalHours = totalDays * 24;
      const totalMinutes = totalHours * 60;
      const totalSeconds = totalMinutes * 60;

      // Calculate days to next birthday
      let nextBirthday = new Date(currentYear, dobMonth - 1, dobDay);
      if (nextBirthday < currentDate) {
        nextBirthday = new Date(currentYear + 1, dobMonth - 1, dobDay);
      }
      const daysToBirthday = Math.ceil((nextBirthday - currentDate) / (1000 * 60 * 60 * 24));

      // Display results
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <p><strong>Age:</strong> ${years} years, ${months} months, ${days} days</p>
        <p><strong>Total Weeks:</strong> ${totalWeeks}</p>
        <p><strong>Total Days:</strong> ${totalDays}</p>
        <p><strong>Total Hours:</strong> ${totalHours}</p>
        <p><strong>Total Minutes:</strong> ${totalMinutes}</p>
        <p><strong>Total Seconds:</strong> ${totalSeconds}</p>
        <p><strong>Days to Next Birthday:</strong> ${daysToBirthday}</p>
      `;
      resultDiv.style.display = 'block';
    }
  </script>
</body>
</html>
